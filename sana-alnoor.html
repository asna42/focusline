<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>سنا النور</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#060809;--bg2:#0c1014;--card:#111619;--card2:#161d22;--bord:rgba(180,145,50,.13);--bordH:rgba(180,145,50,.38);--gold:#c9a227;--goldL:#e8c547;--goldD:rgba(201,162,39,.14);--silver:#c8c8c8;--green:#27a85f;--greenD:rgba(39,168,95,.11);--tx:#ede5d0;--tx2:#7a8e9a;--tx3:#3a4a58}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--tx);font-family:'Cairo',sans-serif;direction:rtl;min-height:100vh;overflow-x:hidden}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--gold);border-radius:3px}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes glow{0%,100%{box-shadow:0 0 14px rgba(180,180,180,.08)}50%{box-shadow:0 0 30px rgba(220,220,220,.2)}}
.fu{animation:fadeUp .4s ease both}.fi{animation:fadeIn .3s ease both}
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 18px;border-radius:9px;font-family:'Cairo',sans-serif;font-weight:700;font-size:13px;cursor:pointer;transition:all .22s;border:none;outline:none}
.btn-g{background:linear-gradient(135deg,var(--gold),var(--goldL));color:#070a0c}.btn-g:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(201,162,39,.35)}
.btn-o{background:transparent;color:var(--gold);border:1px solid var(--bord)}.btn-o:hover{border-color:var(--gold);background:var(--goldD)}
.btn-r{background:rgba(220,50,50,.1);color:#ff7070;border:1px solid rgba(220,50,50,.2)}.btn-r:hover{background:rgba(220,50,50,.2)}
.btn-ghost{background:rgba(255,255,255,.04);color:var(--tx2);border:1px solid var(--bord)}.btn-ghost:hover{border-color:var(--silver);color:var(--silver)}
.card{background:var(--card);border:1px solid var(--bord);border-radius:16px;overflow:hidden;transition:all .28s;cursor:pointer}
.card:hover{border-color:var(--bordH);background:var(--card2);transform:translateY(-3px);box-shadow:0 12px 38px rgba(0,0,0,.45)}
.inp{background:rgba(255,255,255,.04);border:1px solid var(--bord);border-radius:10px;color:var(--tx);font-family:'Cairo',sans-serif;font-size:14px;padding:9px 13px;width:100%;transition:border-color .2s;outline:none}
.inp:focus{border-color:var(--gold);box-shadow:0 0 0 3px var(--goldD)}.inp::placeholder{color:var(--tx3)}
textarea.inp{resize:vertical}select.inp option{background:#111619;color:var(--tx)}
.lbl{font-size:12px;color:var(--tx3);margin-bottom:5px;display:block;font-weight:600}
.tag{background:var(--goldD);color:var(--gold);border:1px solid rgba(201,162,39,.2);border-radius:20px;padding:3px 11px;font-size:11px;font-weight:600;display:inline-flex;align-items:center;gap:4px}
.cbadge{padding:3px 12px;border-radius:20px;font-size:11px;font-weight:700;display:inline-block}
.vblock{background:linear-gradient(135deg,rgba(39,168,95,.05),rgba(201,162,39,.05));border:1px solid var(--bord);border-right:3px solid var(--gold);border-radius:12px;padding:14px 18px;font-family:'Amiri',serif;font-size:17px;line-height:2.1}
.hblock{background:rgba(39,168,95,.06);border:1px solid rgba(39,168,95,.14);border-right:3px solid var(--green);border-radius:12px;padding:14px 18px;font-family:'Amiri',serif;font-size:15px;line-height:1.9;color:var(--tx2)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.86);backdrop-filter:blur(12px);z-index:1000;display:flex;align-items:center;justify-content:center;padding:14px}
.mbox{background:var(--card);border:1px solid var(--bord);border-radius:20px;width:100%;max-width:700px;max-height:92vh;overflow-y:auto;padding:24px;animation:fadeUp .3s ease}
nav{background:rgba(6,8,9,.97);backdrop-filter:blur(22px);border-bottom:1px solid var(--bord);position:sticky;top:0;z-index:100}
.nb{display:flex;align-items:center;gap:5px;background:transparent;color:var(--tx2);border:1px solid transparent;border-radius:20px;padding:6px 14px;cursor:pointer;font-family:'Cairo',sans-serif;font-size:13px;font-weight:600;transition:all .2s}
.nb:hover{color:var(--tx);background:rgba(255,255,255,.04)}.nb.active{background:var(--goldD);color:var(--gold);border-color:rgba(201,162,39,.25)}
.st{font-size:18px;font-weight:700;color:var(--tx);display:flex;align-items:center;gap:10px;margin-bottom:16px}
.st::before{content:'';display:block;width:4px;height:19px;background:linear-gradient(var(--gold),var(--green));border-radius:2px;flex-shrink:0}
.ptbg{position:fixed;inset:0;opacity:.02;background-image:repeating-linear-gradient(45deg,var(--gold) 0,var(--gold) 1px,transparent 0,transparent 50%),repeating-linear-gradient(-45deg,var(--gold) 0,var(--gold) 1px,transparent 0,transparent 50%);background-size:36px 36px;pointer-events:none;z-index:0}
.g-auto{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:15px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.g-lat{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.ftbar{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:500;display:flex;gap:7px;background:rgba(8,10,12,.96);backdrop-filter:blur(18px);border:1px solid var(--bord);border-radius:50px;padding:7px 14px;box-shadow:0 8px 30px rgba(0,0,0,.55);white-space:nowrap}
.avatar{width:54px;height:54px;border-radius:50%;border:2px solid var(--bord);display:flex;align-items:center;justify-content:center;overflow:hidden;background:var(--goldD);flex-shrink:0}
.avatar img{width:100%;height:100%;object-fit:cover}
.eov{position:absolute;inset:0;z-index:10;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;border-radius:16px;backdrop-filter:blur(2px)}
.hidden{display:none!important}
#toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);padding:10px 20px;border-radius:10px;font-size:13px;font-weight:700;z-index:9999;backdrop-filter:blur(8px);white-space:nowrap;font-family:'Cairo',sans-serif;display:none}
.pbox{background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.1);border-radius:11px;padding:12px 14px;margin-bottom:8px}
@media(max-width:600px){.g2{grid-template-columns:1fr}.g-auto{grid-template-columns:1fr}.g-lat{grid-template-columns:1fr}}
</style>

var _fbOK=false, _myTs='';
(function(){
  var s1=document.createElement('script');
  s1.src='https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js';
  s1.onload=function(){
    var s2=document.createElement('script');

      if(!firebase.apps.length)firebase.initializeApp(FB_CFG);
      window.db=firebase.firestore();

      setSyncStatus('🟢 متصل بـ Firebase');
      fbListen();
    };
    document.head.appendChild(s2);
  };
  s1.onerror=function(){setSyncStatus('🔴 وضع بدون إنترنت');};
  document.head.appendChild(s1);
})();

function setSyncStatus(t){var el=document.getElementById('sync-st');if(el)el.textContent=t;}

function fbSave(){
  if(!_fbOK||!window.db)return;
  var ts=new Date().toISOString();
  _myTs=ts;
  window.db.collection('site').doc('data').set({
    videos:S.videos,reciters:S.reciters,cats:S.cats,nav:S.nav,settings:S.settings,ts:ts
  }).catch(function(e){console.error('fbSave:',e);});
}

function fbListen(){
  if(!window.db)return;
  window.db.collection('site').doc('data').onSnapshot(function(doc){
    if(!doc.exists)return;
    var d=doc.data();
    if(!d||d.ts===_myTs)return;
    if(d.videos!==undefined)S.videos=d.videos||[];
    if(d.reciters&&d.reciters.length)S.reciters=d.reciters;
    if(d.cats&&d.cats.length)S.cats=d.cats;
    if(d.nav&&d.nav.length)S.nav=d.nav;
    if(d.settings)S.settings=d.settings;
    renderNav();renderHome();
    if(S.page==='admin')renderAdmin();
    if(S.page==='reciters')renderReciters();
    showToast('🔄 تم التحديث');
  },function(e){setSyncStatus('🔴 خطأ في الاتصال');});
}

function load(){try{var d=localStorage.getItem('sn');if(d){var p=JSON.parse(d);['videos','reciters','cats','nav','settings'].forEach(function(k){if(p[k])S[k]=p[k];});}}catch(e){}}
function save(){
  try{localStorage.setItem('sn',JSON.stringify({videos:S.videos,reciters:S.reciters,cats:S.cats,nav:S.nav,settings:S.settings}));}catch(e){}
  fbSave();
}

// ══ HELPERS ══
function uid(){return Math.random().toString(36).slice(2,9);}
function xe(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function fd(d){try{return new Date(d).toLocaleDateString('ar-SA',{year:'numeric',month:'long',day:'numeric'});}catch(e){return d||'';}}
function fv(n){return !n?'0':n>=1000?(n/1000).toFixed(1)+'k':String(n);}
function cc(name){var c=S.cats.find(function(c){return c.name===name;});return c?c.color:'#c9a227';}
function cleanAr(t){return(t||'').replace(/[\u064B-\u065F\u0670]/g,'').toLowerCase().trim();}

function showToast(msg,err){
  var t=document.getElementById('toast');if(!t)return;
  t.textContent=msg;
  t.style.cssText='position:fixed;bottom:80px;left:50%;transform:translateX(-50%);padding:10px 20px;border-radius:10px;font-size:13px;font-weight:700;z-index:9999;backdrop-filter:blur(8px);white-space:nowrap;font-family:Cairo,sans-serif;display:flex;animation:fadeUp .3s ease;background:'+(err?'rgba(200,40,40,.95)':'rgba(30,140,70,.95)')+';color:#fff';
  clearTimeout(t._t);t._t=setTimeout(function(){t.style.display='none';},2500);
}
function openM(h){document.getElementById('modal').innerHTML='<div class="ov" onclick="if(event.target===this)closeM()">'+h+'</div>';}
function closeM(){document.getElementById('modal').innerHTML='';}
function setLogos(){var src=S.settings.logo||LOGO;['logo-n','logo-h'].forEach(function(id){var el=document.getElementById(id);if(el)el.src=src;});}

// ══ NAV ══
function renderNav(){
  var el=document.getElementById('nav-links');el.innerHTML='';
  S.nav.filter(function(n){return n.visible&&n.page!=='admin';}).forEach(function(n){
    var b=document.createElement('button');
    b.className='nb'+(S.page===n.page&&!S.filterCats.length&&!S.filterReciter&&!S.search?' active':'');
    b.textContent=n.label;
    b.onclick=function(){n.page==='home'?goHome():showPg(n.page);};
    el.appendChild(b);
  });
  var an=S.nav.find(function(n){return n.page==='admin';}),ab=document.getElementById('ab');
  if(ab){ab.style.display=(an&&an.visible)?'flex':'none';ab.style.color=S.page==='admin'?'var(--gold)':'var(--tx3)';ab.style.background=S.page==='admin'?'var(--goldD)':'none';}
}
function showPg(p){
  S.page=p;
  document.querySelectorAll('[id^="pg-"]').forEach(function(e){e.classList.add('hidden');});
  var pg=document.getElementById('pg-'+p);if(pg){pg.classList.remove('hidden');pg.classList.add('fi');}
  renderNav();
  if(p==='home')renderHome();
  if(p==='reciters')renderReciters();
  if(p==='admin')renderAdmin();
}
function goHome(){
  S.search='';S.filterCats=[];S.filterReciter=null;
  var si=document.getElementById('sinp');if(si)si.value='';
  cancelSearch();showPg('home');
}

// ══ SEARCH ══
function openSearch(){
  document.getElementById('nav-links').classList.add('hidden');
  document.getElementById('search-btn').classList.add('hidden');
  var nl=document.getElementById('nl');nl.style.opacity='0';nl.style.pointerEvents='none';
  var b=document.getElementById('search-bar');b.classList.remove('hidden');b.style.display='flex';
  setTimeout(function(){document.getElementById('sinp').focus();},50);
}
function cancelSearch(){
  document.getElementById('nav-links').classList.remove('hidden');
  document.getElementById('search-btn').classList.remove('hidden');
  var nl=document.getElementById('nl');nl.style.opacity='1';nl.style.pointerEvents='auto';
  document.getElementById('search-bar').classList.add('hidden');
  S.search='';var si=document.getElementById('sinp');if(si)si.value='';
  var sx=document.getElementById('sx');if(sx)sx.classList.add('hidden');
  if(S.page==='home')renderHome();
}
function clearS(){
  var si=document.getElementById('sinp');if(si)si.value='';
  document.getElementById('sx').classList.add('hidden');
  S.search='';if(S.page==='home')renderHome();
}
function doSearch(q){
  S.search=q;
  var sx=document.getElementById('sx');if(sx){q?sx.classList.remove('hidden'):sx.classList.add('hidden');}
  if(S.page!=='home')showPg('home');else renderHome();
}
function getF(){
  var v=S.videos.slice();
  if(S.filterReciter)v=v.filter(function(x){return x.reciter===S.filterReciter;});
  if(S.filterCats.length)v=v.filter(function(x){return S.filterCats.indexOf(x.category)>-1;});
  if(S.search.trim()){
    var sc=cleanAr(S.search);
    v=v.filter(function(x){
      return cleanAr(x.title).indexOf(sc)>-1||cleanAr(x.surah).indexOf(sc)>-1||
             cleanAr(x.category).indexOf(sc)>-1||cleanAr(x.reciter).indexOf(sc)>-1||
             (x.verses||[]).some(function(vv){return cleanAr(vv).indexOf(sc)>-1;})||
             (x.hadiths||[]).some(function(h){return cleanAr(h).indexOf(sc)>-1;})||
             (x.keywords||[]).some(function(k){return cleanAr(k).indexOf(sc)>-1;});
    });
  }
  return v;
}
function toggleCat(n){
  var i=S.filterCats.indexOf(n);if(i>-1)S.filterCats.splice(i,1);else S.filterCats.push(n);
  S.filterReciter=null;renderHome();
}

// ══ RENDER HOME ══
function renderHome(){
  setLogos();
  var el;
  el=document.getElementById('sub');if(el)el.textContent=S.settings.subtitle;

function openNM(){
  openM('<div class="mbox" style="max-width:450px" onclick="event.stopPropagation()"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px"><h2 style="font-size:16px;font-weight:700">تخصيص القوائم</h2><button onclick="closeM()" style="background:none;border:none;cursor:pointer;color:var(--tx2);font-size:20px">✕</button></div>'
    +'<div id="nrow">'+S.nav.map(function(n){return'<div data-id="'+n.id+'" data-vis="'+n.visible+'" style="display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.03);border:1px solid var(--bord);border-radius:9px;padding:7px 11px;margin-bottom:6px"><span style="color:'+(n.visible?'var(--green)':'var(--tx3)')+';font-size:11px;width:12px;flex-shrink:0">'+(n.visible?'●':'○')+'</span><input class="inp" value="'+xe(n.label)+'" style="flex:1;padding:5px 9px;font-size:13px"><button onclick="tvs(this)" data-vis="'+n.visible+'" style="background:rgba(255,255,255,.04);color:var(--tx2);border:1px solid var(--bord);border-radius:6px;padding:4px 9px;font-size:11px;cursor:pointer;font-family:Cairo,sans-serif;white-space:nowrap">'+(n.visible?'إخفاء':'إظهار')+'</button><button onclick="this.closest(\'[data-id]\').remove()" class="btn btn-r" style="padding:4px 7px">🗑</button></div>';}).join('')+'</div>'
    +'<button class="btn btn-o" onclick="addNR()" style="width:100%;justify-content:center;margin-bottom:12px">+ إضافة قائمة جديدة</button>'
    +'<div style="display:flex;gap:8px"><button class="btn btn-g" onclick="saveNav()" style="flex:1;justify-content:center">✓ حفظ</button><button class="btn btn-o" onclick="closeM()">إلغاء</button></div></div>');
}
function tvs(btn){var vis=btn.dataset.vis==='true';btn.dataset.vis=!vis;btn.textContent=!vis?'إخفاء':'إظهار';var row=btn.closest('[data-id]');row.dataset.vis=!vis;var dot=row.querySelector('span');if(dot){dot.textContent=!vis?'●':'○';dot.style.color=!vis?'var(--green)':'var(--tx3)';}}
function addNR(){var d=document.createElement('div');var id=uid();d.dataset.id=id;d.dataset.vis='true';d.style.cssText='display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.03);border:1px solid var(--bord);border-radius:9px;padding:7px 11px;margin-bottom:6px';d.innerHTML='<span style="color:var(--green);font-size:11px;width:12px;flex-shrink:0">●</span><input class="inp" value="قائمة جديدة" style="flex:1;padding:5px 9px;font-size:13px"><button onclick="tvs(this)" data-vis="true" style="background:rgba(255,255,255,.04);color:var(--tx2);border:1px solid var(--bord);border-radius:6px;padding:4px 9px;font-size:11px;cursor:pointer;font-family:Cairo,sans-serif;white-space:nowrap">إخفاء</button><button onclick="this.closest(\'[data-id]\').remove()" class="btn btn-r" style="padding:4px 7px">🗑</button>';document.getElementById('nrow').appendChild(d);}
function saveNav(){var rows=document.querySelectorAll('#nrow [data-id]');S.nav=[].map.call(rows,function(row){var inp=row.querySelector('input');var orig=S.nav.find(function(n){return n.id===row.dataset.id;});return{id:row.dataset.id,label:inp?inp.value.trim():'قائمة',page:orig?orig.page:'home',visible:row.dataset.vis==='true'};});save();closeM();showToast('تم حفظ القوائم');renderNav();}

// ══ SITE SETTINGS ══
function openSS(){
  var ss=S.settings;
  openM('<div class="mbox" style="max-width:420px" onclick="event.stopPropagation()"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px"><h2 style="font-size:16px;font-weight:700">إعدادات الموقع</h2><button onclick="closeM()" style="background:none;border:none;cursor:pointer;color:var(--tx2);font-size:20px">✕</button></div>'
    +'<div style="display:grid;gap:12px"><div><span class="lbl">اسم الموقع</span><input class="inp" id="ssn" value="'+xe(ss.siteName)+'" placeholder="سنا النور"></div>'
    +'<div><span class="lbl">الآية أو الشعار</span><input class="inp" id="sss" value="'+xe(ss.subtitle)+'" style="font-family:Amiri,serif;font-size:14px"></div>'
    +'<div><span class="lbl">شعار الموقع</span><div style="display:flex;gap:9px;align-items:center"><img id="sslogop" src="'+xe(ss.logo||LOGO)+'" style="width:52px;height:52px;object-fit:contain;border-radius:10px;border:1px solid var(--bord);background:#000"><button class="btn btn-ghost" onclick="document.getElementById(\'ssli\').click()">🖼 رفع شعار</button><input type="file" id="ssli" accept="image/*" style="display:none" onchange="prvLogo(this)"></div><input type="hidden" id="sslogo" value="'+xe(ss.logo||'')+'"></div></div>'
    +'<div style="display:flex;gap:8px;margin-top:16px"><button class="btn btn-g" onclick="saveSS()" style="flex:1;justify-content:center">✓ حفظ</button><button class="btn btn-o" onclick="closeM()">إلغاء</button></div></div>');
}
function prvLogo(inp){var file=inp.files[0];if(!file)return;var r=new FileReader();r.onload=function(e){var h=document.getElementById('sslogo');if(h)h.value=e.target.result;var p=document.getElementById('sslogop');if(p)p.src=e.target.result;};r.readAsDataURL(file);}
function saveSS(){S.settings.siteName=(document.getElementById('ssn')||{value:'سنا النور'}).value.trim()||'سنا النور';S.settings.subtitle=(document.getElementById('sss')||{value:''}).value.trim();var l=document.getElementById('sslogo');if(l&&l.value)S.settings.logo=l.value;save();closeM();showToast('تم حفظ الإعدادات');renderHome();}

// ══ EXPORT / IMPORT ══
function exportData(){var data={videos:S.videos,reciters:S.reciters,cats:S.cats,nav:S.nav,settings:S.settings};var json=JSON.stringify(data,null,2);var blob=new Blob([json],{type:'application/json'});var url=URL.createObjectURL(blob);var a=document.createElement('a');a.href=url;var d=new Date();a.download='سنا-النور-'+d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()+'.json';document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);showToast('تم التصدير ✓');}
function importData(inp){var file=inp.files[0];if(!file)return;var reader=new FileReader();reader.onload=function(e){try{var data=JSON.parse(e.target.result);if(data.videos)S.videos=data.videos;if(data.reciters)S.reciters=data.reciters;if(data.cats)S.cats=data.cats;if(data.nav)S.nav=data.nav;if(data.settings)S.settings=data.settings;save();renderNav();renderHome();if(S.page==='admin')renderAdmin();if(S.page==='reciters')renderReciters();showToast('تم استيراد '+S.videos.length+' مقطع ✓');}catch(err){showToast('خطأ في الملف',true);}inp.value='';};reader.readAsText(file);}

// ══ EDIT MODE ══
function toggleEdit(){
  S.editMode=!S.editMode;
  var btn=document.getElementById('etog'),tools=document.getElementById('etools');
  if(S.editMode){btn.style.background='var(--goldD)';btn.style.color='var(--gold)';btn.style.borderColor='rgba(201,162,39,.4)';btn.textContent='⬤ وضع التعديل';tools.classList.remove('hidden');tools.style.display='flex';}
  else{btn.style.background='transparent';btn.style.color='var(--tx2)';btn.style.borderColor='var(--bord)';btn.textContent='✏️ تعديل الموقع';tools.classList.add('hidden');}
  renderHome();
}

// ══ INIT ══
load();setLogos();renderNav();renderHome();

</script>
</body>
</html>
